<div hidden aria-hidden="true">
<script>
(() => {
  const event = __CELEBRATION_EVENT__;
  const goal = event.kind === 'goal';
  const previous = window.__videoSchoolGoalCelebration;
  if (previous?.id === event.id) return;
  // A quick lesson completion must not interrupt the daily finale.
  if (!goal && previous?.kind === 'goal' && previous.cleanup) return;
  previous?.cleanup?.();
  const random = (min, max) => min + Math.random() * (max - min);
  const pick = items => items[Math.floor(Math.random() * items.length)];
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const history = window.__videoSchoolCelebrationVariants ||= {};
  const variants = goal ? ['starfall', 'orbital', 'bloom'] : ['petals', 'spiral', 'comets'];
  const variant = pick(variants.filter(name => name !== history[event.kind]));
  history[event.kind] = variant;

  // A separate, fixed layer survives app rerenders without capturing input.
  const host = document.createElement('div');
  host.id = goal ? 'daily-goal-celebration' : 'lesson-completion-celebration';
  host.dataset.variant = variant;
  Object.assign(host.style, {
    position: 'fixed', inset: '0', zIndex: '2147483000',
    pointerEvents: 'none', overflow: 'hidden',
  });
  const shadow = host.attachShadow({mode: 'open'});
  const canvas = document.createElement('canvas');
  Object.assign(canvas.style, {
    position: 'absolute', inset: '0', width: '100%', height: '100%',
    pointerEvents: 'none',
  });
  host.setAttribute('aria-hidden', 'true');
  shadow.appendChild(canvas);
  document.body.appendChild(host);

  const ctx = canvas.getContext('2d');
  let width, height, frame = 0, timer, stopped = false;
  const particles = [], rockets = [], halos = [];
  const colors = pick([
    ['#ffd05a', '#4bffe0', '#fff4cf'],
    ['#b28aff', '#66cfff', '#ff99da'],
    ['#ff779b', '#ffcc6b', '#fff1d2'],
    ['#54ffd0', '#bd8bff', '#ffe087'],
  ]);
  const glows = new Map();
  function glow(color) {
    if (glows.has(color)) return glows.get(color);
    const sprite = document.createElement('canvas');
    sprite.width = sprite.height = 32;
    const brush = sprite.getContext('2d');
    const light = brush.createRadialGradient(16, 16, 0, 16, 16, 16);
    light.addColorStop(0, color);
    light.addColorStop(.15, color + 'bb');
    light.addColorStop(.45, color + '28');
    light.addColorStop(1, color + '00');
    brush.fillStyle = light;
    brush.fillRect(0, 0, 32, 32);
    glows.set(color, sprite);
    return sprite;
  }
  const tau = Math.PI * 2;
  const duration = goal ? random(8100, 8700) : 2400;
  const show = [];
  function schedule(at, x, y, type, options = {}) {
    show.push({at, x, y, type, color: Math.floor(random(0, colors.length)),
      phase: random(0, tau), instant: true, ...options});
  }

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    const ratio = Math.min(window.devicePixelRatio || 1, 1.75);
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    ctx?.setTransform(ratio, 0, 0, ratio, 0, 0);
  }

  function cleanup() {
    if (stopped) return;
    stopped = true;
    cancelAnimationFrame(frame);
    clearTimeout(timer);
    window.removeEventListener('resize', resize);
    window.removeEventListener('pagehide', cleanup);
    document.removeEventListener('visibilitychange', onVisibility);
    host.remove();
    particles.length = rockets.length = halos.length = show.length = 0;
    glows.clear();
    window.__videoSchoolGoalCelebration = {id: event.id, kind: event.kind, variant};
  }
  function onVisibility() { if (document.hidden) cleanup(); }
  window.__videoSchoolGoalCelebration = {id: event.id, kind: event.kind, variant, cleanup};
  window.addEventListener('pagehide', cleanup);
  document.addEventListener('visibilitychange', onVisibility);
  timer = setTimeout(cleanup, duration);
  if (!ctx) { cleanup(); return; }
  resize();
  window.addEventListener('resize', resize, {passive: true});

  // Small effects sit just above the current lesson's action button.
  const button = document.querySelector('.stMain [data-testid="stBaseButton-primary"]');
  const rect = button?.getBoundingClientRect();
  const anchor = {
    x: clamp(rect ? rect.left + rect.width / 2 : width * .62, 100, width - 100) / width,
    y: clamp(rect ? rect.top - 42 : height * .55, 120, height - 120) / height,
  };
  if (!goal) {
    if (variant === 'comets') {
      schedule(0, anchor.x, anchor.y, 'star', {count: 18, speed: 45});
      for (let i = 0; i < 3; i++) {
        schedule(i * 100, anchor.x + (i - 1) * 65 / width,
          anchor.y - random(30, 70) / height, 'star', {
            instant: false, from: anchor, travel: .3, count: 30, speed: 65,
            bend: random(-.05, .05),
          });
      }
    } else {
      schedule(0, anchor.x, anchor.y, variant, {count: 76, speed: 105});
      schedule(180, anchor.x + random(-25, 25) / width, anchor.y - 15 / height,
        variant === 'spiral' ? 'spiral' : 'orbit', {count: 42, speed: 75, reverse: true});
    }
  } else if (variant === 'starfall') {
    // Shooting stars break into satellite bursts before a golden-rain finale.
    const direction = Math.random() < .5 ? -1 : 1;
    for (let i = 0; i < 9; i++) {
      schedule(i * random(290, 410), random(.15, .85), random(.16, .47), 'star', {
        instant: i === 0, from: {x: direction < 0 ? 1.05 : -.05, y: random(.02, .20)},
        bend: random(-.14, .14), travel: random(.5, .85), branch: true,
      });
    }
    schedule(4200, random(.38, .62), .22, 'willow', {count: 200, speed: 260, branch: true});
  } else if (variant === 'orbital') {
    // Tilted rings and counter-rotating spirals form a moving miniature galaxy.
    const center = random(.40, .60);
    schedule(0, center, .34, 'spiral', {count: 150, speed: 230});
    for (let i = 0; i < 8; i++) {
      const angle = i / 8 * tau + random(-.25, .25);
      schedule(250 + i * random(310, 430), center + Math.cos(angle) * .26,
        .35 + Math.sin(angle) * .18, i % 2 ? 'spiral' : 'orbit', {
          instant: false, from: {x: center, y: .90}, reverse: i % 2 === 0,
          travel: random(.45, .7), bend: random(-.18, .18),
        });
    }
    schedule(4300, center, .30, 'orbit', {count: 160, speed: 280, branch: true});
    schedule(4700, center, .30, 'spiral', {count: 160, speed: 220, reverse: true});
  } else {
    // Petal-shaped shells unfold into a branching bouquet across the viewport.
    const mirror = Math.random() < .5 ? -1 : 1;
    for (let i = 0; i < 9; i++) {
      schedule(i * random(330, 430), .5 + mirror * (i % 2 ? -1 : 1) * random(.12, .32),
        random(.18, .45), i % 3 ? 'petals' : 'peony', {
          instant: i === 0, from: {x: random(.20, .80), y: .96},
          travel: random(.45, .7), branch: i % 3 === 0,
        });
    }
    schedule(4200, random(.36, .64), .25, 'petals', {count: 185, speed: 265, branch: true});
    schedule(4650, random(.40, .60), .25, 'willow', {count: 150, speed: 220});
  }
  show.sort((a, b) => a.at - b.at);

  function burst(rocket, elapsed) {
    const x = rocket.x * width, y = rocket.y * height;
    const scale = clamp(Math.min(width, height) / (goal ? 740 : 900), .65, 1.4);
    const count = Math.round((rocket.count || 125) * (goal && width < 600 ? .65 : 1));
    const speed = (rocket.speed || 220) * scale;
    const phase = rocket.phase, petals = pick([4, 5, 6]);
    halos.push({x, y, age: 0, color: colors[rocket.color], radius: (goal ? 95 : 38) * scale});
    for (let i = 0; i < count; i++) {
      const portion = i / count, angle = portion * tau + phase;
      let radius = random(.3, 1), vyScale = 1, curl = 0;
      if (rocket.type === 'orbit') { radius = i % 3 ? 1 : .55; vyScale = .45; curl = .35; }
      if (rocket.type === 'petals') radius = (.56 + .44 * Math.cos(petals * angle)) * random(.75, 1);
      if (rocket.type === 'star') radius = .25 + .75 * Math.pow(Math.abs(Math.cos(2 * angle)), 5);
      if (rocket.type === 'spiral') { radius = .2 + .8 * portion; curl = (rocket.reverse ? -1 : 1) * 2.2; }
      const a = rocket.type === 'spiral' ? portion * tau * 3 + phase : angle;
      let vx = Math.cos(a) * speed * radius, vy = Math.sin(a) * speed * radius * vyScale;
      if (rocket.type === 'orbit') {
        const tiltedX = vx * Math.cos(phase) - vy * Math.sin(phase);
        vy = vx * Math.sin(phase) + vy * Math.cos(phase); vx = tiltedX;
      }
      const willow = rocket.type === 'willow';
      const life = goal ? (willow ? random(2.1, 2.8) : random(1.4, 2.3)) : random(1.0, 1.65);
      particles.push({
        x, y, vx, vy, curl,
        age: 0, life, drag: willow ? .4 : .8,
        gravity: willow ? 68 : (curl ? 8 : 35),
        color: i % 7 === 0 ? '#fff7dc' : (i % 4 ? colors[rocket.color] : pick(colors)),
        size: random(goal ? 1.3 : 1, goal ? 2.5 : 1.8) * scale,
        twinkle: random(0, tau), trail: [],
      });
    }
    if (goal && rocket.branch) {
      for (let i = 0; i < 3; i++) {
        const a = phase + i / 3 * tau;
        schedule(elapsed + random(280, 520), clamp(rocket.x + Math.cos(a) * .10, .08, .92),
          clamp(rocket.y + Math.sin(a) * .09, .10, .60), 'star', {count: 32, speed: 100});
      }
      show.sort((a, b) => a.at - b.at);
    }
  }

  const start = performance.now();
  let last = start;
  function draw(now) {
    if (stopped) return;
    const elapsed = now - start;
    if (elapsed >= duration) { cleanup(); return; }
    const dt = Math.min((now - last) / 1000, .04);
    last = now;
    ctx.clearRect(0, 0, width, height);
    ctx.globalCompositeOperation = 'lighter';
    const fade = Math.min(1, (duration - elapsed) / (goal ? 900 : 450));

    while (show.length && elapsed >= show[0].at) {
      const launch = show.shift();
      if (launch.instant) burst(launch, elapsed);
      else rockets.push({...launch, age: 0, travel: launch.travel || .6});
    }
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.age += dt;
      const t = Math.min(1, r.age / r.travel);
      const origin = r.from || {x: r.x, y: .94};
      const control = {x: (origin.x + r.x) / 2 + (r.bend || 0), y: Math.min(origin.y, r.y) - .12};
      const point = progress => ({
        x: ((1-progress)**2 * origin.x + 2*(1-progress)*progress*control.x + progress**2*r.x) * width,
        y: ((1-progress)**2 * origin.y + 2*(1-progress)*progress*control.y + progress**2*r.y) * height,
      });
      const head = point(t);
      const tail = point(Math.max(0, t - .14));
      const gradient = ctx.createLinearGradient(tail.x, tail.y, head.x, head.y);
      gradient.addColorStop(0, 'transparent');
      gradient.addColorStop(1, colors[r.color]);
      ctx.globalAlpha = .85 * fade;
      ctx.strokeStyle = gradient;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(tail.x, tail.y);
      for (let j = 1; j <= 8; j++) {
        const p = point(Math.max(0, t - .14) + Math.min(.14, t) * j / 8); ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
      ctx.fillStyle = '#fff5d3';
      ctx.beginPath(); ctx.arc(head.x, head.y, 2.2, 0, tau); ctx.fill();
      if (t >= 1) { burst(r, elapsed); rockets.splice(i, 1); }
    }
    for (let i = halos.length - 1; i >= 0; i--) {
      const h = halos[i]; h.age += dt;
      if (h.age > .7) { halos.splice(i, 1); continue; }
      const radius = h.radius * (.5 + h.age * 1.5);
      const gradient = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, radius);
      gradient.addColorStop(0, h.color + '50');
      gradient.addColorStop(.35, h.color + '18');
      gradient.addColorStop(1, h.color + '00');
      ctx.globalAlpha = Math.pow(1 - h.age / .7, 2) * fade;
      ctx.fillStyle = gradient;
      ctx.fillRect(h.x - radius, h.y - radius, radius * 2, radius * 2);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      p.trail.push({x: p.x, y: p.y});
      if (p.trail.length > 7) p.trail.shift();
      if (p.curl) {
        const a = p.curl * dt, vx = p.vx * Math.cos(a) - p.vy * Math.sin(a);
        p.vy = p.vx * Math.sin(a) + p.vy * Math.cos(a); p.vx = vx;
      }
      const drag = Math.exp(-p.drag * dt);
      p.vx *= drag; p.vy = p.vy * drag + p.gravity * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const life = 1 - p.age / p.life;
      const shimmer = p.age > .6 ? .55 + .45 * Math.pow(Math.sin(p.age * 19 + p.twinkle), 2) : 1;
      const alpha = Math.min(1, life * 2) * shimmer * fade;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.size * .75;
      for (let j = 1; j < p.trail.length; j++) {
        ctx.globalAlpha = alpha * (j / p.trail.length) * .52;
        ctx.beginPath(); ctx.moveTo(p.trail[j - 1].x, p.trail[j - 1].y);
        ctx.lineTo(p.trail[j].x, p.trail[j].y); ctx.stroke();
      }
      ctx.globalAlpha = alpha * .8;
      const glowSize = p.size * 9;
      ctx.drawImage(glow(p.color), p.x - glowSize / 2, p.y - glowSize / 2, glowSize, glowSize);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * Math.max(.4, life), 0, tau); ctx.fill();
      if (shimmer > .91 && p.age > .5) {
        ctx.strokeStyle = '#fff7da'; ctx.lineWidth = .7;
        ctx.beginPath(); ctx.moveTo(p.x - 3, p.y); ctx.lineTo(p.x + 3, p.y);
        ctx.moveTo(p.x, p.y - 3); ctx.lineTo(p.x, p.y + 3); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    frame = requestAnimationFrame(draw);
  }
  frame = requestAnimationFrame(draw);
})();
</script>
</div>
